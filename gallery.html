<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <title>MarkMellon | Visual Gallery</title>
    <script type="module" src="https://markmellon3.github.io/Maria-Ads/assets/ad-network/maria-ads.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #888888;
            --border-color: #e2e2e2;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* ==========================================
           HEADER & NAVIGATION
           ========================================== */
        header {
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: opacity 0.2s;
        }

        nav a:hover, nav a.active {
            opacity: 0.6;
        }
        
        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--text-main);
        }

        /* ==========================================
           GALLERY SECTION
           ========================================== */
        .gallery-section {
            padding: 60px 50px;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-title {
            font-family: var(--font-serif);
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: none;
            border: none;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
        }

        .filter-btn.active, .filter-btn:hover {
            color: var(--text-main);
        }

        .filter-btn.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--text-main);
        }

        /* ==========================================
           MASONRY GRID
           ========================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 300px;
            gap: 20px;
            grid-auto-flow: dense;
        }

        .gallery-item {
            overflow: hidden;
            position: relative;
            cursor: pointer;
            background: #f5f5f5;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: grayscale(20%);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        /* Varying grid item sizes for dynamic layout */
        .tall {
            grid-row: span 2;
        }
        .wide {
            grid-column: span 2;
        }

        /* ==========================================
           FOOTER
           ========================================== */
        footer {
            padding: 40px 50px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            margin-top: 60px;
        }

        footer p {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .wide {
                grid-column: span 1;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }
            nav ul {
                gap: 20px;
            }
            .gallery-section {
                padding: 40px 20px;
            }
            .gallery-title {
                font-size: 32px;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: 250px;
            }
            .tall {
                grid-row: span 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MarkMellon</div>
        <nav>
            <ul>
                <li><a href="https://smmaria.site">Home</a></li>
                <li><a href="https://smmaria.site/#Projects">Projects</a></li>
                <li><a href="https://smmaria.site" class="active">Gallery</a></li>
                <li><a href="https://smmaria.site">About</a></li>
                <li><a href="https://smmaria.site">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="gallery-section">
        <div class="gallery-header">
            <h1 class="gallery-title">The Visual Portfolio</h1>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="mark">Mark (2)</button>
                <button class="filter-btn" data-filter="natura">Natura (5)</button>
                <button class="filter-btn" data-filter="urban">Urban (4)</button>
            </div>
        </div>

        <div class="gallery-grid">
            <!-- URBAN -->
            <div class="gallery-item tall" data-category="urban">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_3295.png?updatedAt=1784811936473" alt="Urban Fashion 1">
            </div>
            <div class="gallery-item tall" data-category="urban">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_4547.png" alt="Urban Fashion 2">
            </div>
            
            <!-- NATURA -->
            <div class="gallery-item" data-category="natura">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_4549.png" alt="Nature Fashion 1">
            </div>
            
            <!-- MARK -->
            <div class="gallery-item wide" data-category="mark">
                <img src="https://ik.imagekit.io/s95tumxuk/5e36251a-bab7-48d7-91b4-d5a81e227651.jpeg?updatedAt=1774794483813" alt="Mark Fashion 1">
            </div>
            
            <!-- NATURA -->
            <div class="gallery-item" data-category="natura">
                <img src="https://ik.imagekit.io/s95tumxuk/2c116d43-68b0-432f-a600-75547546aebb.jpeg?updatedAt=1774443432785" alt="Nature Fashion 2">
            </div>
            
            <!-- URBAN -->
            <div class="gallery-item" data-category="urban">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_2489.png" alt="Urban Fashion 3">
            </div>
            
            <!-- MARK -->
            <div class="gallery-item" data-category="mark">
                <img src="https://ik.imagekit.io/s95tumxuk/retouch_2025122620470457_Original.jpeg?updatedAt=1774794483478" alt="Mark Fashion 2">
            </div>
            
            <!-- NATURA -->
            <div class="gallery-item tall" data-category="natura">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_5126.png?updatedAt=1788618720218" alt="Nature Fashion 3">
            </div>
            
            <!-- URBAN -->
            <div class="gallery-item" data-category="urban">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_2485_1o7XozYCh.png?updatedAt=1789336968191" alt="MARKMELLON">
            </div>
            
            <!-- NATURA -->
            <div class="gallery-item" data-category="natura">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_2480.jpeg" alt="MARKMELLON">
            </div>
            
            <!-- URBAN -->
            <div class="gallery-item wide" data-category="urban">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_2547.png" alt="MARKMELLON">
            </div>
            
            <!-- NATURA -->
            <div class="gallery-item" data-category="natura">
                <img src="https://ik.imagekit.io/s95tumxuk/IMG_4549.png" alt="MARKMELLON1">
            </div>
        </div>

        <!-- HIDDEN AD TRIGGER (Moved outside the grid so it doesn't break the layout) -->
        <div class="maria-ad" data-placement="placement_homepage" style="display: none;"></div>
    </section>

    <footer>
        <p>&copy; 2024 MarkMellon Visuals. All Rights Reserved.</p>
    </footer>

    <script>
        // ==========================================
        // CATEGORY FILTER LOGIC
        // ==========================================
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons
                filterBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                btn.classList.add('active');

                const filter = btn.getAttribute('data-filter');

                // Loop through all items
                galleryItems.forEach(item => {
                    const category = item.getAttribute('data-category');
                    
                    if (filter === 'all' || filter === category) {
                        item.style.display = 'block';
                        // Optional: Add a subtle fade-in animation
                        setTimeout(() => {
                            item.style.opacity = '1';
                            item.style.transform = 'scale(1)';
                        }, 50);
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // Initial styling for transition
        galleryItems.forEach(item => {
            item.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        });
    </script>

    <!-- 3. PREMIUM POP-OUT AD CARD (CSS, HTML, & JS) -->
    <style>
        .maria-popup-overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 360px;
            max-width: calc(100% - 40px);
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            z-index: 9999;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .maria-popup-overlay.show {
            opacity: 1;
            transform: translateY(0);
        }
        .maria-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .maria-popup-sponsor {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .maria-popup-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }
        .maria-popup-close:hover {
            color: #ef4444;
        }
        .maria-popup-body {
            padding: 16px;
        }
        .maria-popup-body .maria-ad-inner {
            display: block;
            text-decoration: none;
            color: inherit;
        }
        /* FIX: Entire image is shown without cropping */
        .maria-popup-body img {
            width: 100%;
            height: auto;
            max-height: none;
            display: block;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .maria-popup-body h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
        }
        .maria-popup-body p {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }
        .maria-popup-footer {
            display: flex;
            gap: 10px;
            padding: 0 16px 16px 16px;
        }
        .maria-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .maria-btn-visit {
            background: #4f46e5;
            color: #ffffff;
        }
        .maria-btn-visit:hover {
            background: #4338ca;
        }
        .maria-btn-create {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .maria-btn-create:hover {
            background: #e2e8f0;
        }
        @media (max-width: 480px) {
            .maria-popup-overlay {
                left: 10px;
                right: 10px;
                bottom: 10px;
                width: auto;
            }
        }
    </style>

    <div id="maria-ad-popup" class="maria-popup-overlay">
        <div class="maria-popup-header">
            <span class="maria-popup-sponsor">Sponsored by Maria Ads</span>
            <button class="maria-popup-close" id="maria-close-btn">&times;</button>
        </div>
        <div class="maria-popup-body" id="maria-popup-body">
            <!-- The SDK will inject the ad image/text here -->
        </div>
        <div class="maria-popup-footer">
            <a href="#" target="_blank" class="maria-btn maria-btn-visit" id="maria-visit-btn">Visit Site</a>
            <a href="https://markmellon3.github.io/Maria-Ads/signup.html" target="_blank" class="maria-btn maria-btn-create">Create Ad</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const popup = document.getElementById('maria-ad-popup');
            const popupBody = document.getElementById('maria-popup-body');
            const closeBtn = document.getElementById('maria-close-btn');
            const visitBtn = document.getElementById('maria-visit-btn');

            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    popup.classList.remove('show');
                });
            }

            const targetPlacement = document.querySelector('.maria-ad[data-placement="placement_homepage"]');
            
            if (targetPlacement) {
                const observer = new MutationObserver((mutations) => {
                    for (const mutation of mutations) {
                        if (mutation.addedNodes.length > 0) {
                            const adInner = targetPlacement.querySelector('.maria-ad-inner');
                            
                            if (adInner && !popup.classList.contains('show')) {
                                const destUrl = adInner.getAttribute('href');
                                
                                popupBody.innerHTML = '';
                                popupBody.appendChild(adInner);
                                
                                if (destUrl && destUrl !== '#') {
                                    visitBtn.setAttribute('href', destUrl);
                                    visitBtn.style.display = 'block';
                                } else {
                                    visitBtn.style.display = 'none';
                                }

                                setTimeout(() => {
                                    popup.classList.add('show');
                                }, 1000);
                                
                                observer.disconnect();
                                break;
                            }
                        }
                    }
                });
                observer.observe(targetPlacement, { childList: true, subtree: true });
            }
        });
    </script>
</body>
