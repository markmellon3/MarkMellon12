<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <title>MarkMellon | Visual Gallery</title>
    <script type="module" src="https://ads.smmaria.site/assets/ad-network/maria-ads.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #888888;
            --border-color: #e2e2e2;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* ==========================================
           HEADER & NAVIGATION
           ========================================== */
        header {
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: opacity 0.2s;
        }

        nav a:hover, nav a.active {
            opacity: 0.6;
        }
        
        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--text-main);
        }

        /* ==========================================
           GALLERY SECTION
           ========================================== */
        .gallery-section {
            padding: 60px 50px;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-title {
            font-family: var(--font-serif);
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: none;
            border: none;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
        }

        .filter-btn.active, .filter-btn:hover {
            color: var(--text-main);
        }

        .filter-btn.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--text-main);
        }

        /* ==========================================
           MASONRY GRID
           ========================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 300px;
            gap: 20px;
            grid-auto-flow: dense;
        }

        .gallery-item {
            overflow: hidden;
            position: relative;
            cursor: pointer;
            background: #f5f5f5;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: grayscale(20%);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        /* Varying grid item sizes for dynamic layout */
        .tall {
            grid-row: span 2;
        }
        .wide {
            grid-column: span 2;
        }

        /* ==========================================
           FOOTER
           ========================================== */
        footer {
            padding: 40px 50px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            margin-top: 60px;
        }

        footer p {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .wide {
                grid-column: span 1;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }
            nav ul {
                gap: 20px;
            }
            .gallery-section {
                padding: 40px 20px;
            }
            .gallery-title {
                font-size: 32px;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: 250px;
            }
            .tall {
                grid-row: span 1;
            }
        }
    </style>
</head>

    <script>
        // ==========================================
        // CATEGORY FILTER LOGIC
        // ==========================================
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons
                filterBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                btn.classList.add('active');

                const filter = btn.getAttribute('data-filter');

                // Loop through all items
                galleryItems.forEach(item => {
                    const category = item.getAttribute('data-category');
                    
                    if (filter === 'all' || filter === category) {
                        item.style.display = 'block';
                        // Optional: Add a subtle fade-in animation
                        setTimeout(() => {
                            item.style.opacity = '1';
                            item.style.transform = 'scale(1)';
                        }, 50);
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // Initial styling for transition
        galleryItems.forEach(item => {
            item.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        });
    </script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Configuration ---
        const TARGET_PLACEMENT = 'placement_homepage';
        
        // --- State Variables ---
        let popupInitialized = false;
        let observer = null;

        console.log('[Maria Ads] Popup initialized');

        // --- DOM References ---
        const popupContainer = document.getElementById('maria-ad-popup');
        const bannerContainer = document.getElementById('maria-banner-container');

        // --- Initialization ---
        initializePopup();

        function initializePopup() {
            const targetPlacement = findTargetPlacement();
            if (!targetPlacement) return;

            const existingAd = findExistingAd(targetPlacement);
            if (existingAd) {
                console.log('[Maria Ads] Ad detected immediately:', existingAd);
                handleAdDetected(existingAd);
            } else {
                observeForAd(targetPlacement);
            }
        }

        function findTargetPlacement() {
            const placement = document.querySelector(`.maria-ad[data-placement="${TARGET_PLACEMENT}"]`);
            if (!placement) {
                console.warn('[Maria Ads] Popup placement not found:', TARGET_PLACEMENT);
            }
            return placement;
        }

        function findExistingAd(placement) {
            return placement.querySelector('.maria-ad-inner');
        }

        function observeForAd(placement) {
            console.log('[Maria Ads] Waiting for ad...');
            observer = new MutationObserver((mutations) => {
                for (const mutation of mutations) {
                    if (mutation.addedNodes.length > 0) {
                        const adInner = findExistingAd(placement);
                        if (adInner) {
                            console.log('[Maria Ads] Ad detected via observer:', adInner);
                            handleAdDetected(adInner);
                            cleanupObserver();
                            return;
                        }
                    }
                }
            });
            observer.observe(placement, { childList: true, subtree: true });
        }

        function cleanupObserver() {
            if (observer) {
                observer.disconnect();
                observer = null;
            }
        }

        function handleAdDetected(adInner) {
            if (popupInitialized) return;
            popupInitialized = true;

            const adData = extractAdData(adInner);
            
            // Hide original ad container so it doesn't show duplicate/raw data
            const targetPlacement = findTargetPlacement();
            if (targetPlacement) {
                targetPlacement.style.display = 'none';
            }
            
            renderPopupAd(adData);
            renderBannerAd(adData); // Prepare banner in background
            showPopup();
        }

        function extractAdData(adInner) {
            const data = {
                destinationUrl: adInner.getAttribute('data-destination-url') || adInner.getAttribute('href'),
                title: adInner.getAttribute('data-title') || adInner.getAttribute('data-brand-name'),
                description: adInner.getAttribute('data-description'),
                imageUrl: adInner.getAttribute('data-image-url') || adInner.getAttribute('data-brand-logo')
            };

            // Fallbacks
            if (!data.imageUrl) {
                const img = adInner.querySelector('img');
                if (img) data.imageUrl = img.src;
            }
            if (!data.title) {
                const titleEl = adInner.querySelector('h4, .ad-title');
                if (titleEl) data.title = titleEl.innerText;
            }
            if (!data.description) {
                const descEl = adInner.querySelector('p, .ad-desc');
                if (descEl) data.description = descEl.innerText;
            }

            return data;
        }

        // ==========================================
        // LARGE POPUP LOGIC
        // ==========================================
        function renderPopupAd(adData) {
            if (!validateDestinationUrl(adData.destinationUrl)) {
                console.warn('[Maria Ads] Invalid or missing destination URL.');
                return;
            }

            const html = `
                <div class="maria-popup-header">
                    <span class="maria-popup-sponsor">Sponsored by Maria Ads</span>
                    <button class="maria-popup-close" id="maria-close-btn" aria-label="Close ad">&times;</button>
                </div>
                <div class="maria-popup-body">
                    ${adData.imageUrl ? `<img src="${escapeHtml(adData.imageUrl)}" alt="${escapeHtml(adData.title || 'Advertisement')}" onerror="this.style.display='none'">` : ''}
                    ${adData.title ? `<h4>${escapeHtml(adData.title)}</h4>` : ''}
                    ${adData.description ? `<p>${escapeHtml(adData.description)}</p>` : ''}
                </div>
                <div class="maria-popup-footer">
                    <a href="${escapeHtml(adData.destinationUrl)}" target="_blank" rel="noopener noreferrer" class="maria-btn maria-btn-visit">Visit Site</a>
                    <a href="https://ads.smmaria.site" target="_blank" rel="noopener noreferrer" class="maria-btn maria-btn-create">Create Ad</a>
                </div>
            `;
            
            popupContainer.innerHTML = html;
            
            const closeBtn = document.getElementById('maria-close-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', hidePopup);
            }
        }

        function showPopup() {
            setTimeout(() => {
                popupContainer.classList.add('show');
                console.log('[Maria Ads] Large popup displayed');
            }, 1000);
        }

        function hidePopup() {
            popupContainer.classList.remove('show');
            console.log('[Maria Ads] Large popup dismissed, showing banner...');
            
            // Show the banner after the popup closes
            setTimeout(() => {
                showBanner();
            }, 500);
        }

        // ==========================================
        // SMALL BANNER LOGIC
        // ==========================================
        function renderBannerAd(adData) {
            if (!validateDestinationUrl(adData.destinationUrl)) return;

            const html = `
                <a href="${escapeHtml(adData.destinationUrl)}" target="_blank" rel="noopener noreferrer" class="maria-banner">
                    ${adData.imageUrl ? `<img src="${escapeHtml(adData.imageUrl)}" alt="${escapeHtml(adData.title || 'Advertisement')}" class="maria-banner-logo" onerror="this.style.display='none'">` : ''}
                    <div class="maria-banner-content">
                        <div class="maria-banner-title">${escapeHtml(adData.title || 'Sponsored')}</div>
                        <div class="maria-banner-desc">${escapeHtml(adData.description || 'Click to learn more')}</div>
                    </div>
                    <div class="maria-banner-cta">View</div>
                </a>
            `;
            bannerContainer.innerHTML = html;
        }

        function showBanner() {
            bannerContainer.classList.add('show');
            console.log('[Maria Ads] Banner displayed');
        }

        // --- Helpers ---
        function validateDestinationUrl(url) {
            if (!url) return false;
            try {
                const parsed = new URL(url);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch (e) {
                return false;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    });
</script>
